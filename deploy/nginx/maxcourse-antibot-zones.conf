# Include once inside nginx's http {} block.
#
# Empty map keys are not accounted by limit_req_zone, so these zones affect
# only MAXCOURSE API paths even though the directives live at http scope.
map $uri $maxcourse_api_ip_key {
    default "";
    ~^/api/ $binary_remote_addr;
}

map $uri $maxcourse_expensive_ip_key {
    default "";
    ~^/api/(?:register|login(?:/ispace)?|user/bind/ispace|ddl|optimize|recommend|parse-transcript|media-dl/(?:resolve|proxy|merge))(?:/|$) $binary_remote_addr;
}

map $uri $maxcourse_api_server_key {
    default "";
    ~^/api/ $server_name;
}

map $uri $maxcourse_api_loggable {
    default 0;
    ~^/api/ 1;
}

# Deliberately generous campus-NAT ceilings. The server snippet initially runs
# these in dry-run mode, so the first 72 hours collect evidence without rejects.
limit_req_zone $maxcourse_api_ip_key
    zone=maxcourse_api_ip:10m
    rate=100r/s;
limit_req_zone $maxcourse_expensive_ip_key
    zone=maxcourse_expensive_ip:10m
    rate=60r/m;
limit_req_zone $maxcourse_api_server_key
    zone=maxcourse_api_server:10m
    rate=300r/s;

log_format maxcourse_antibot escape=json
    '{"ts":"$time_iso8601","request_id":"$request_id",'
    '"ip":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"request_time":$request_time,'
    '"request_bytes":$request_length,"response_bytes":$bytes_sent,'
    '"limit_req":"$limit_req_status","ua":"$http_user_agent"}';
