# Include inside the bnbscheduler.top server {} block.
#
# Observe only for the first 72 hours. Nginx records PASSED,
# REJECTED_DRY_RUN, and DELAYED_DRY_RUN but never slows or rejects a request.
limit_req_dry_run on;
limit_req_status 429;

limit_req zone=maxcourse_api_ip burst=300 nodelay;
limit_req zone=maxcourse_expensive_ip burst=30 nodelay;
limit_req zone=maxcourse_api_server burst=600 nodelay;

access_log /www/wwwlogs/maxcourse-antibot-observe.log
    maxcourse_antibot
    if=$maxcourse_api_loggable;
