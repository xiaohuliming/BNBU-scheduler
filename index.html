                                        <div className="flex gap-2 items-end mb-3">
                                            <div className="flex-1">
                                                <select value={newBlockDay} onChange={(e) => setNewBlockDay(e.target.value)} className="bg-white border-2 border-black px-2 py-1 font-bold rounded shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] h-[34px] w-full">
                                                    {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => <option key={d} value={d}>{d}</option>)}
                                                </select>
                                            </div>
                                            <div className="w-24"><input type="time" value={newBlockStart} onChange={(e) => setNewBlockStart(e.target.value)} className="bg-white border-2 border-black px-1 py-1 font-bold rounded shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] h-[34px] w-full text-sm"/></div>
                                            <div className="w-24"><input type="time" value={newBlockEnd} onChange={(e) => setNewBlockEnd(e.target.value)} className="bg-white border-2 border-black px-1 py-1 font-bold rounded shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] h-[34px] w-full text-sm"/></div>
                                            <button onClick={addBlockedSlot} className="bg-black text-white px-3 h-[34px] font-bold border-2 border-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-[2px] active:shadow-none shrink-0"><Plus className="w-4 h-4" /></button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {blockedSlots.map(b => (
                                                <div key={b.id} className="bg-red-100 border border-red-500 text-red-700 px-2 py-1 text-xs font-bold flex items-center gap-1 rounded">
                                                    <span>{b.day} {b.start}-{b.end}</span>
                                                    <button onClick={() => removeBlockedSlot(b.id)} className="hover:text-red-900"><X className="w-3 h-3" /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-7 flex flex-col gap-8">
                                <div className="bg-[#3b82f6] border-4 border-black p-8 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] text-center">
                                    <h2 className="text-3xl font-black text-white mb-2 drop-shadow-[2px_2px_0px_rgba(0,0,0,1)]">开始计算</h2>
                                    <p className="font-bold text-black mb-6">系统将自动尝试所有Session组合以避免时间冲突</p>
                                    <button onClick={calculateOptimal} disabled={selectedCodes.length === 0 || isCalculating} className="bg-[#d6ff62] text-black font-black text-2xl py-6 px-12 border-4 border-black hover:shadow-[8px_8px_0px_0px_rgba(255,255,255,1)] hover:-translate-y-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3 mx-auto w-full md:w-auto">
                                        {isCalculating ? <React.Fragment><RefreshCcw className="animate-spin w-8 h-8" /> 计算中...</React.Fragment> : <React.Fragment><Calculator className="w-8 h-8" /> 计算最优课表</React.Fragment>}
                                    </button>
                                </div>

                                <div className="flex-1 bg-black border-4 border-black shadow-[8px_8px_0px_0px_rgba(100,100,100,1)] p-6 md:p-8 min-h-[400px] relative">
                                    <div className="absolute top-0 right-0 bg-[#ec4899] text-white px-3 py-1 font-bold text-sm z-10 border-l-4 border-b-4 border-black">RESULT</div>
                                    {!optimalSchedule ? (
                                        <div className="h-full flex flex-col items-center justify-center text-[#333]">
                                            <Award className="w-24 h-24 mb-4 text-[#333]" />
                                            <p className="text-2xl font-black text-white opacity-20">等待计算结果...</p>
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in">
                                            <div className="flex flex-col md:flex-row justify-between items-end mb-8 border-b-4 border-white pb-4 gap-4">
                                                <div><h2 className="text-4xl font-black text-white mb-2">最佳方案</h2><p className="text-gray-400 font-bold">成功排入 {optimalSchedule.courses.length} 门课程，周课表见下方 ↓</p></div>
                                                <div className="bg-[#ec4899] text-white p-4 border-2 border-white shadow-[4px_4px_0px_0px_#fff] rotate-1"><span className="block text-sm font-bold uppercase">Total Units</span><span className="block text-5xl font-black">{optimalSchedule.totalUnits}</span></div>
                                            </div>
                                            <div className="grid gap-3">
                                                {optimalSchedule.courses.map((c) => (
                                                    <div key={c.id} className="bg-white border-4 border-transparent hover:border-[#d6ff62] p-3 flex items-center gap-3 transition-all">
                                                        <div className={`w-3 self-stretch ${c.color} border-r-2 border-black shrink-0`}></div>
                                                        <div className="min-w-0">
                                                            <div className="flex items-center gap-2 mb-0.5"><span className="bg-black text-white text-xs font-bold px-1.5 py-0.5">{c.code}</span>{c.teacher && <span className="text-xs font-bold text-gray-500 truncate">{c.teacher}</span>}</div>
                                                            <h3 className="font-black leading-tight truncate">{c.name}</h3>
                                                        </div>
                                                        <span className="ml-auto shrink-0 bg-[#d6ff62] border-2 border-black text-xs font-black px-2 py-1">{c.units} 学分</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {optimalSchedule && (
                            <div id="weekly-timetable" className="max-w-6xl mx-auto px-4 mt-10 scroll-mt-24 animate-fade-in">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-3xl font-black uppercase flex items-center gap-2"><Calendar className="w-7 h-7" /> 一周课程表</h2>
                                    <span className="bg-black text-[#d6ff62] font-black px-3 py-1 border-2 border-black">{optimalSchedule.totalUnits} 学分 / {optimalSchedule.courses.length} 门课</span>
                                </div>
                                <div className="shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                                    <WeeklyTimetable slots={optimalSchedule.flatSchedule} />
                                </div>

                                <h2 className="text-2xl font-black uppercase mt-10 mb-4 flex items-center gap-2"><BookOpen className="w-6 h-6" /> 课程信息</h2>
                                <div className="grid gap-4 md:grid-cols-2">
                                    {optimalSchedule.courses.map((c) => (
                                        <div key={c.id} className="bg-white border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] p-4">
                                            <div className="flex items-center gap-2 mb-2">
                                                <span className={`w-3 h-8 ${c.color} border-2 border-black shrink-0`}></span>
                                                <span className="bg-black text-white text-xs font-bold px-1.5 py-0.5">{c.code}</span>
                                                <span className="text-xs font-bold text-gray-500">Session {c.session}</span>
                                                <span className="ml-auto bg-[#d6ff62] border-2 border-black text-xs font-black px-2 py-0.5 shrink-0">{c.units} 学分</span>
                                            </div>
                                            <button onClick={() => setInsightCourse(c.code)} className="font-black text-lg leading-tight text-left hover:underline decoration-2" title="查看课程详情">{c.name}</button>
                                            <div className="flex flex-wrap gap-x-4 gap-y-1 text-sm font-bold text-gray-700 mt-1.5">
                                                {c.teacher && <span className="flex items-center gap-1"><User className="w-3.5 h-3.5" /> {c.teacher}</span>}
                                                {c.room && <span className="flex items-center gap-1"><Building2 className="w-3.5 h-3.5" /> {c.room}</span>}
                                            </div>
                                            <div className="flex flex-wrap gap-2 mt-2.5">
                                                {c.schedules.map((s, i) => (
                                                    <span key={i} className="bg-gray-200 border border-black/20 px-2 py-0.5 text-xs font-bold flex items-center gap-1"><Clock className="w-3 h-3" /> {DAY_ZH[s.day]} {s.start}-{s.end}</span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        </React.Fragment>
                    )}

                    {viewingCourse && <CourseDetailsModal course={viewingCourse} onClose={() => setViewingCourse(null)} />}
                    {insightCourse && <CourseInsightModal
                        initialCode={insightCourse}
                        onClose={() => setInsightCourse(null)}
                        onViewTeacher={(name) => setViewingTeacher(name)}
                        onAddCourse={addCourse}
                        switchToOptimizer={() => goToView('optimizer')}
                        cartCodes={selectedCodes.map(c => c.code)}
                        onRemoveCourse={removeCourse}
                    />}
                    {viewingTeacher && <TeacherProfileModal teacherName={viewingTeacher} onClose={() => setViewingTeacher(null)} />}
                    {currentView !== 'optimizer' && (
                        <CartWidget
                            items={selectedCodes}
                            open={cartOpen}
                            setOpen={setCartOpen}
                            onRemove={removeCourse}
                            onClear={() => { setSelectedCodes([]); setOptimalSchedule(null); }}
                            onGoOptimize={() => { setCartOpen(false); goToView('optimizer'); }}
                            onViewCourse={(code) => setInsightCourse(code)}
                            onClearTeacher={(code) => updatePreferredTeacher(code, '')}
                        />
                    )}
                    {viewingRoom && <ClassroomDetailModal room={viewingRoom} onClose={() => setViewingRoom(null)} />}
                    {showAuthModal && <AuthModal onClose={() => setShowAuthModal(false)} onLoginSuccess={setUser} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
    // Babel 回退加载器:动态建新 <script>(老的 onerror 里改 this.src 不会重新
    // 抓取,是死代码),本地失败换 CDN;若 babel 在 DOMContentLoaded 之后才就位,
    // 它自己的自动转译钩子不会再触发,需要手动调 transformScriptTags。
    window.__bootBabel = function (src) {
        var b = document.createElement('script');
        b.src = src;
        b.onload = function () {
            if (document.readyState !== 'loading' && window.Babel && Babel.transformScriptTags) {
                Babel.transformScriptTags();
            }
        };
        b.onerror = function () {
            if (src.indexOf('bootcdn.net') === -1) {
                window.__bootBabel('https://cdn.bootcdn.net/ajax/libs/babel-standalone/7.24.7/babel.min.js');
            }
        };
        document.body.appendChild(b);
    };
    (function () {
        // 预编译引导:JSX 校验和与 <html data-compiled-sum> 的前段匹配 → 直接跑
        // app.compiled.js(跳过 Babel 下载与现场转译);不匹配(改了 JSX 没重跑
        // node precompile.js)或产物加载失败(404/断网)→ 回退浏览器内 Babel,
        // 页面照常能用只是慢。stamp 的 "+build" 后缀把转译工具链版本编进缓存
        // URL:JSX 没变但预编译选项变了,也能击穿一年 immutable 缓存。
        var src = document.querySelector('script[type="text/babel"]').textContent;
        var h = 0;
        for (var i = 0; i < src.length; i++) h = (h * 31 + src.charCodeAt(i)) | 0;
        var sum = String(h >>> 0) + '-' + src.length;
        var stamp = document.documentElement.getAttribute('data-compiled-sum') || '';
        if (stamp.split('+')[0] === sum) {
            document.write('<script src="/app.compiled.js?v=' + encodeURIComponent(stamp)
                + '" onerror="__bootBabel(\'/vendor/babel.min.js\')"><\/script>');
        } else {
            if (window.console) console.warn('app.compiled.js 校验和不匹配,回退到浏览器内 Babel(改了 JSX 记得跑 node precompile.js)');
            window.__bootBabel('/vendor/babel.min.js');
        }
    })();
    </script>
</body>
