        const PRIORITY_BUILDINGS = ['T8', 'T7', 'T6', 'T5', 'T4', 'T29'];

        const timeToMinutes = (value) => {
            const [hours, minutes] = String(value).split(':').map(Number);
            return hours * 60 + minutes;
        };

        const getBuildingSortKey = (building) => {
            const normalized = String(building || '').trim().toUpperCase();
            const priorityIndex = PRIORITY_BUILDINGS.indexOf(normalized);

            if (priorityIndex !== -1) {
                return [0, priorityIndex, 0, '', 0, normalized];
            }

            if (normalized === 'CC') {
                return [2, 0, 0, '', 0, normalized];
            }

            const matched = normalized.match(/^([A-Z]+)(\d+)$/);
            if (matched) {
                return [1, 0, 0, matched[1], Number(matched[2]), normalized];
            }

            return [1, 1, 1, normalized, 0, normalized];
        };

        const compareBuildingOrder = (left, right) => {
            const leftKey = getBuildingSortKey(left);
            const rightKey = getBuildingSortKey(right);

            for (let index = 0; index < Math.max(leftKey.length, rightKey.length); index += 1) {
                if (leftKey[index] < rightKey[index]) return -1;
                if (leftKey[index] > rightKey[index]) return 1;
            }

            return 0;
        };

        const getRoomLocationMeta = (roomCode) => {
            const room = String(roomCode || '').trim().toUpperCase();
            const matched = room.match(/^([A-Z0-9]+)-(\d+)([A-Z]*)$/);

            if (!matched) {
                return {
                    room,
                    building: room,
                    floorNumber: null,
                    floorLabel: 'Other',
                    detailLabel: room,
                    roomSuffix: room,
                };
            }

            const [, building, numericPart] = matched;
            const floorNumber = numericPart.length >= 3 ? Number(numericPart[0]) : null;

            return {
                room,
                building,
                floorNumber,
                floorLabel: floorNumber !== null ? `${floorNumber}F` : 'Other',
                detailLabel: floorNumber !== null ? `${building} 教学楼 · ${floorNumber}F` : `${building} 教学楼`,
                roomSuffix: numericPart,
            };
        };

        const compareRoomCode = (left, right) => left.localeCompare(right, undefined, { numeric: true, sensitivity: 'base' });

            const data = await response.json();
            if (!response.ok) {

                const onDown = (e) => { if (scopeRef.current && !scopeRef.current.contains(e.target)) setScopeOpen(false); };

                fetch('/api/courses?semester=' + encodeURIComponent(scope))
                    .then(r => r.json())
                    .then(d => { if (alive && Array.isArray(d)) setScopeData(prev => ({ ...prev, [scope]: d })); })
                    .catch(() => {})
                    .finally(() => { if (alive) setScopeLoading(false); });
                return () => { alive = false; };
            }, [scope]);

            const activeCourses = scope === 'current' ? availableCourses : (scopeData[scope] || []);
            const currentCodes = useMemo(() => new Set((availableCourses || []).map(c => c.code)), [availableCourses]);

            // Programme (study-plan) filter: only courses in a programme's plan
            const [progList, setProgList] = useState([]);
            const [progFilter, setProgFilter] = useState('');
            const [progRole, setProgRole] = useState('');
            const [progMaps, setProgMaps] = useState({});
            const [progLoading, setProgLoading] = useState(false);

            useEffect(() => {
                fetch('/api/programmes').then(r => r.json()).then(d => setProgList(d.programmes || [])).catch(() => {});
            }, []);

            useEffect(() => {
                if (!progFilter || progMaps[progFilter]) return;
                let alive = true;
                setProgLoading(true);
                fetch('/api/programme-courses?programme=' + encodeURIComponent(progFilter))
                    .then(r => r.json())
                    .then(d => { if (alive && d && d.courses) setProgMaps(prev => ({ ...prev, [progFilter]: d.courses })); })
                    .catch(() => {})
                    .finally(() => { if (alive) setProgLoading(false); });
                return () => { alive = false; };
            }, [progFilter]);

            const progGrouped = useMemo(() => {
                const g = {};
                progList.forEach(p => { (g[p.faculty] = g[p.faculty] || []).push(p); });
                return g;
            }, [progList]);
            const progMap = progFilter ? (progMaps[progFilter] || null) : null;

            const allOfferings = useMemo(() => {
                if (!activeCourses) return [];
                const offerings = [];
                activeCourses.forEach(course => {
                    if (!course.details) return;
                    course.details.forEach(row => {
                         const titleAndSession = row['Course Title & Session'] || course.name;
                         let session = "";
                         const sessionMatch = titleAndSession.match(/\((\d+)\)$/);
                         if (sessionMatch) session = sessionMatch[1];

                         offerings.push({
                             code: row['Course Code'] || course.code,
                             title: titleAndSession,
                             name: course.name,
                             session: session,
                             units: row['Units'],
                             teacher: row['Teachers'],
                             schedule: row['Class Schedule'],
                             classroom: row['Classroom'],
                             curriculumType: row['Curriculum Type'],
                             electiveType: row['Elective Type'],
                             offeringUnit: row['Offering Unit'],
                             offeringProgramme: row['Offering Programme'],
                             requirements: row['Requirements'],
                             hours: row['Hours']
                         });
                    });
                });
                return offerings;
            }, [activeCourses]);

            const uniqueOptions = useMemo(() => {
                const units = new Set();
                const programmes = new Set();
                const types = new Set();
                const hoursList = new Set();
                const sessions = new Set();
                allOfferings.forEach(o => {
                    if(o.offeringUnit) units.add(o.offeringUnit);
                    if(o.offeringProgramme) programmes.add(o.offeringProgramme);
                    if(o.curriculumType) types.add(o.curriculumType);
                    if(o.hours) hoursList.add(o.hours);
                    if(o.session) sessions.add(o.session);
                });
                return {
                    units: Array.from(units).sort(),
                    programmes: Array.from(programmes).sort(),
                    types: Array.from(types).sort(),
                    hours: Array.from(hoursList).sort((a,b) => parseFloat(a) - parseFloat(b)),
                    sessions: Array.from(sessions).sort()
                };
            }, [allOfferings]);

            const hasActiveSearch = searchQuery.length > 0 || Object.values(filters).some(Boolean) || scope !== 'current' || !!progFilter;

            const filteredDatabase = useMemo(() => {
                if (!hasActiveSearch) return [];
                let result = allOfferings;
                const lowerQuery = searchQuery.toLowerCase();

                if (searchQuery) {
                    result = result.filter(item => 
                        String(item.code).toLowerCase().includes(lowerQuery) ||
                        String(item.title).toLowerCase().includes(lowerQuery) ||
                        String(item.teacher).toLowerCase().includes(lowerQuery) ||
                        String(item.classroom).toLowerCase().includes(lowerQuery)
                    );
                }
                if (filters.unit) result = result.filter(item => item.offeringUnit === filters.unit);
                if (filters.programme) result = result.filter(item => item.offeringProgramme === filters.programme);
                if (filters.type) result = result.filter(item => item.curriculumType === filters.type);
                if (filters.hours) result = result.filter(item => String(item.hours) === filters.hours);
                if (filters.day) result = result.filter(item => item.schedule && item.schedule.includes(filters.day));
                if (filters.session) result = result.filter(item => item.session === filters.session);
                if (progFilter) {
                    if (!progMap) return [];
                    result = result.filter(item => {
                        const role = progMap[item.code];
                        return role && (!progRole || role === progRole);
                    });
                }
                return result;
            }, [searchQuery, filters, allOfferings, hasActiveSearch, progFilter, progMap, progRole]);

            useEffect(() => setCurrentPage(1), [searchQuery, filters, scope, progFilter, progRole]);

            const paginatedResults = useMemo(() => {
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                return filteredDatabase.slice(start, start + ITEMS_PER_PAGE);
            }, [filteredDatabase, currentPage]);

            const totalPages = Math.ceil(filteredDatabase.length / ITEMS_PER_PAGE);

            const clearFilters = () => {
                setFilters({ unit: '', programme: '', type: '', day: '', hours: '', session: '' });
                setSearchQuery('');
                setProgFilter('');
                setProgRole('');
            };

            return (
                <div className={`transition-all duration-500 ${hasActiveSearch ? 'space-y-6 md:space-y-8' : 'min-h-[60vh] flex flex-col justify-center'}`}>
                    <div className={`bg-white border-4 border-black p-4 md:p-6 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] md:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all ${hasActiveSearch ? '' : 'max-w-3xl mx-auto w-full md:scale-110'}`}>
                        <h2 className="text-2xl md:text-4xl font-black mb-4 uppercase drop-shadow-[2px_2px_0px_rgba(0,0,0,1)] text-center">
                            FIND YOUR <span className="text-[#ec4899]">TARGET</span>
                        </h2>
                        <div className="mb-4 flex gap-2">
                            <div className="relative flex-1 min-w-0">
                                <input
                                    type="text"
                                    placeholder="搜索 Code / 课程名 / 老师 / 教室 ..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full bg-gray-100 border-2 border-black p-3 pl-11 md:p-4 md:pl-14 font-bold text-base md:text-xl focus:outline-none focus:bg-[#3b82f6] focus:text-white focus:placeholder-white transition-colors"
                                />
                                <Search className="absolute left-3 md:left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 md:w-6 md:h-6 text-gray-500 pointer-events-none" strokeWidth={3} />
                            </div>
                            <div className="relative shrink-0" ref={scopeRef}>
                                <button
                                    onClick={() => setScopeOpen(v => !v)}
                                    title="搜索范围：本学期 / 全部课程库 / 历史学期"
                                    aria-haspopup="true"
                                    aria-expanded={scopeOpen}
                                    className={`h-full max-w-[9rem] md:max-w-none border-2 border-black px-3 font-bold text-sm flex items-center gap-1.5 transition-colors ${scope !== 'current' ? 'bg-[#d6ff62]' : 'bg-white hover:bg-gray-50'}`}
                                >
                                    <span className="truncate">{scope === 'current' ? currentLabel : scope === 'all' ? '全部课程库' : ((semesters.find(s => s.key === scope) || {}).label || scope)}</span>
                                    <ChevronDown className={`w-4 h-4 shrink-0 transition-transform ${scopeOpen ? 'rotate-180' : ''}`} />
                                </button>
                                {scopeOpen && (
                                    <div className="absolute right-0 top-full mt-2 w-56 bg-white border-2 border-black shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] z-50 animate-fade-in">
                                        {[{ key: 'current', label: `${currentLabel}（本学期）` }, { key: 'all', label: '全部课程库' }].map(opt => (
                                            <button key={opt.key} onClick={() => { setScope(opt.key); setScopeOpen(false); }}
                                                className={`w-full text-left px-3 py-2.5 font-bold text-sm flex items-center justify-between gap-2 border-b border-black/10 ${scope === opt.key ? 'bg-[#d6ff62]' : 'hover:bg-gray-100'}`}>
                                                <span>{opt.label}</span>
                                                {scope === opt.key && <Check className="w-4 h-4 shrink-0" />}
                                            </button>
                                        ))}
                                        {semesters.length > 0 && (
                                            <div className="px-3 pt-2 pb-1 text-[10px] font-black uppercase tracking-wider text-gray-400 border-b border-black/10 bg-gray-50">历史学期</div>
                                        )}
                                        {semesters.map((s, i) => (
                                            <button key={s.key} onClick={() => { setScope(s.key); setScopeOpen(false); }}
                                                className={`w-full text-left px-3 py-2.5 font-bold text-sm flex items-center justify-between gap-2 ${i < semesters.length - 1 ? 'border-b border-black/10' : ''} ${scope === s.key ? 'bg-[#d6ff62]' : 'hover:bg-gray-100'}`}>
                                                <span>{s.label}</span>
                                                {scope === s.key && <Check className="w-4 h-4 shrink-0" />}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 text-xs font-bold">
                             <select value={filters.unit} onChange={e => setFilters({...filters, unit: e.target.value})} className="w-full min-w-0 border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                <option value="">Offering Unit</option>
                                {uniqueOptions.units.map(u => <option key={u} value={u}>{u}</option>)}
                             </select>
                             <select value={filters.programme} onChange={e => setFilters({...filters, programme: e.target.value})} className="w-full min-w-0 border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                <option value="">Programme</option>
                                {uniqueOptions.programmes.map(p => <option key={p} value={p}>{p}</option>)}
                             </select>
                             <select value={filters.type} onChange={e => setFilters({...filters, type: e.target.value})} className="w-full min-w-0 border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                <option value="">Type</option>
                                {uniqueOptions.types.map(t => <option key={t} value={t}>{t}</option>)}
                             </select>
                             <select value={filters.day} onChange={e => setFilters({...filters, day: e.target.value})} className="w-full min-w-0 border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                <option value="">Day</option>
                                {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => <option key={d} value={d}>{d}</option>)}
                             </select>
                             <select value={filters.hours} onChange={e => setFilters({...filters, hours: e.target.value})} className="w-full min-w-0 border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                <option value="">Hours</option>
                                {uniqueOptions.hours.map(h => <option key={h} value={h}>{h}</option>)}
                             </select>
                             <select value={filters.session} onChange={e => setFilters({...filters, session: e.target.value})} className="w-full min-w-0 border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                <option value="">Session</option>
                                {uniqueOptions.sessions.map(s => <option key={s} value={s}>{s}</option>)}
                             </select>
                        </div>
                        <div className="mt-2 flex flex-wrap items-center gap-2 text-xs font-bold">
                             <select value={progFilter} onChange={e => { setProgFilter(e.target.value); setProgRole(''); }}
                                className={`w-full md:w-auto border-2 border-black p-2 focus:outline-none md:max-w-[16rem] ${progFilter ? 'bg-[#d6ff62]' : 'bg-white focus:bg-[#d6ff62]'}`}>
                                <option value="">培养方案（全部专业）</option>
                                {Object.keys(progGrouped).map(fac => (
                                    <optgroup key={fac} label={FACULTY_LABEL[fac] || fac}>
                                        {progGrouped[fac].map(p => <option key={p.key} value={p.key}>{p.key} · {p.name}</option>)}
                                    </optgroup>
                                ))}
                             </select>
                             {progFilter && (
                                <select value={progRole} onChange={e => setProgRole(e.target.value)}
                                    className="border-2 border-black p-2 bg-white focus:bg-[#d6ff62] focus:outline-none">
                                    <option value="">必修+选修</option>
                                    <option value="主修必修">仅主修必修</option>
                                    <option value="BBA 核心">仅 BBA 核心</option>
                                    <option value="主修选修">仅主修选修</option>
                                </select>
                             )}
                             {progFilter && progLoading && <span className="text-gray-400 flex items-center gap-1"><Loader2 className="w-3.5 h-3.5 animate-spin" /> 加载培养方案…</span>}
                        </div>
                        {hasActiveSearch && (
                            <div className="mt-4 flex justify-between items-center">
                                <span className="text-xs font-bold text-gray-500">Found {filteredDatabase.length} results</span>
                                <button onClick={clearFilters} className="text-xs font-bold underline hover:text-red-600 flex items-center gap-1"><X className="w-3 h-3"/> Clear Filters</button>
                            </div>
                        )}
                    </div>

                    {hasActiveSearch && (
                    <React.Fragment>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
                        {(scopeLoading || progLoading) && paginatedResults.length === 0 ? (
                           <div className="col-span-full text-center py-20 opacity-50">
                              <Loader2 className="w-14 h-14 mx-auto mb-4 animate-spin" />
                              <p className="text-xl font-black">加载学期数据…</p>
                           </div>
                        ) : paginatedResults.length === 0 ? (
                           <div className="col-span-full text-center py-20 opacity-40">
                              <Search className="w-20 h-20 mx-auto mb-4" />
                              <p className="text-2xl font-black">NO RESULTS FOUND</p>
                           </div>
                        ) : (
                          paginatedResults.map((course, idx) => (
                            // 整张卡片都可点进详情;做别的事的控件(老师主页、加入/移除)自己 stopPropagation
                            <div key={idx} onClick={() => onViewCourse && onViewCourse(course.code)} className="bg-white border-4 border-black p-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 transition-all flex flex-col h-full group cursor-pointer">
                              <div className="flex justify-between items-start mb-2 gap-2">
                                <span title="查看课程详情" className="bg-black text-white px-2 py-1 font-black text-lg group-hover:bg-[#ec4899] transition-colors">{course.code}</span>
                                <div className="flex items-center gap-1.5 flex-wrap justify-end">
                                  {progFilter && progMap && progMap[course.code] && (
                                    <span className={`border-2 border-black px-2 py-0.5 font-bold text-xs ${progMap[course.code] === '主修选修' ? 'bg-white' : 'bg-black text-white'}`}>{progMap[course.code]}</span>
                                  )}
                                  {!currentCodes.has(course.code) && <span className="bg-gray-100 border-2 border-black px-2 py-0.5 font-bold text-xs text-gray-500">本学期未开设</span>}
                                  <span className="bg-[#d6ff62] border-2 border-black px-2 py-0.5 font-bold text-xs">{course.units} Units</span>
                                </div>
                              </div>
                              <h3 className="font-black text-xl leading-tight mb-3 min-h-[3rem] group-hover:underline decoration-2 underline-offset-2">{course.title}</h3>
                              <div className="space-y-2 text-sm font-bold text-gray-700 flex-grow">
                                <div className="flex items-center gap-2">
                                   <User className="w-4 h-4 shrink-0" />
                                   <button
                                       onClick={(e) => { e.stopPropagation(); onViewTeacher(course.teacher); }}
                                       className="truncate hover:text-[#3b82f6] hover:underline text-left"
                                       title="View Teacher Profile"
                                   >
                                       {course.teacher} <ExternalLink className="w-3 h-3 inline ml-1" />
                                   </button>
                                </div>
                                <div className="flex items-center gap-2">
                                   <Clock className="w-4 h-4 shrink-0" />
                                   <span className="bg-gray-100 px-1 border border-gray-300">{course.schedule || 'TBA'}</span>
                                </div>
                                 <div className="flex items-center gap-2">
                                   <MapPin className="w-4 h-4 shrink-0" />
                                   <span>{course.classroom || 'TBA'}</span>
                                </div>
                              </div>
                              <div className="mt-4 grid grid-cols-2 gap-2">
                                <button onClick={() => onViewCourse && onViewCourse(course.code)}
                                  className="bg-white text-black font-black py-3 border-2 border-black hover:bg-[#d6ff62] active:translate-y-1 transition-colors flex items-center justify-center gap-1.5">
                                  <BookOpen className="w-4 h-4" /> 详情
                                </button>
                                {!currentCodes.has(course.code) ? (
                                  <span onClick={(e) => e.stopPropagation()} title="本学期未开设，无法加入排课" className="bg-gray-100 text-gray-400 font-black py-3 border-2 border-gray-300 flex items-center justify-center gap-1.5 cursor-not-allowed select-none">
                                    未开设
                                  </span>
                                ) : cartCodes.includes(course.code) ? (
                                  <button onClick={(e) => { e.stopPropagation(); onRemoveCourse && onRemoveCourse(course.code); }} title="已在选课购物车，点击移除"
                                    className="bg-[#d6ff62] text-black font-black py-3 border-2 border-black active:translate-y-1 transition-colors flex items-center justify-center gap-1.5">
                                    <Check className="w-4 h-4" /> 已加入
                                  </button>
                                ) : (
                                  <button onClick={(e) => { e.stopPropagation(); onAddCourse({ code: course.code, name: course.name }, course.teacher); }}
                                    className="bg-black text-white font-black py-3 border-2 border-black hover:bg-[#ec4899] hover:border-black active:translate-y-1 transition-colors flex items-center justify-center gap-1.5">
                                    <Plus className="w-4 h-4" /> 加入
                                  </button>
                                )}
                              </div>
                            </div>
                          ))
                        )}
                    </div>
                    {totalPages > 1 && (
                        <div className="flex justify-center items-center gap-4 py-8">
                            <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="px-4 py-2 font-bold border-2 border-black bg-white hover:bg-gray-100 disabled:opacity-50">Prev</button>
                            <span className="font-bold">Page {currentPage} of {totalPages}</span>
                            <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="px-4 py-2 font-bold border-2 border-black bg-white hover:bg-gray-100 disabled:opacity-50">Next</button>
                        </div>
                    )}
                    </React.Fragment>
                    )}
                </div>
            );
        };

        const CourseDetailsModal = ({ course, onClose }) => {
            if (!course) return null;
            const columns = ["Course Title & Session", "Offering Unit", "Offering Programme", "Units", "Curriculum Type", "Elective Type", "Teachers", "Class Schedule", "Hours", "Classroom", "Requirements"];
            return (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/50" onClick={onClose}></div>
                    <div className="relative bg-white w-full max-w-6xl max-h-[90vh] overflow-hidden flex flex-col border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                        <div className="bg-black text-white p-4 flex justify-between items-center shrink-0">
                            <h2 className="text-xl font-bold">{course.code} - {course.name}</h2>
                            <button onClick={onClose} className="hover:text-red-400 bg-white text-black p-1 rounded transition-transform hover:scale-110"><X className="w-6 h-6" /></button>
                        </div>
                        <div className="overflow-auto p-4 custom-scrollbar bg-white grow">
                            {(!course.details || course.details.length === 0) ? (
                                <div className="text-center py-10 text-red-500 font-bold">No details available.</div>
                            ) : (
                                <table className="w-full text-sm border-collapse border border-black">
                                    <thead className="bg-gray-100 sticky top-0 z-10">
                                        <tr>{columns.map(col => <th key={col} className="border border-black p-2 text-left whitespace-nowrap bg-gray-100 font-bold shadow-sm">{col}</th>)}</tr>
                                    </thead>
                                    <tbody>
                                        {course.details.map((row, idx) => (
                                            <tr key={idx} className="hover:bg-blue-50 transition-colors">
                                                {columns.map(col => <td key={col} className="border border-black p-2 whitespace-nowrap max-w-[300px] overflow-hidden text-ellipsis" title={row[col]}>{row[col]}</td>)}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const SKILL_CAT_STYLE = {
            'Programming Languages': '#c7f9cc',
            'ML & AI': '#ffd6a5',
            'Data Systems': '#a0e7e5',
            'Math & Stats': '#fdffb6',
            'Domain Knowledge': '#ffc6ff',
            'Tools & Platforms': '#bdb2ff',
            'Other': '#eef0f2',
        };

        const SkillChip = ({ name, category, muted, title }) => (
            <span title={title || category || ''} className={`inline-flex items-center border-2 border-black px-2 py-0.5 text-xs font-bold ${muted ? 'opacity-40 line-through' : ''}`} style={{ background: SKILL_CAT_STYLE[category] || '#eef0f2' }}>{name}</span>
        );

        const fmtSalary = (n) => (n || n === 0) ? '$' + Number(n).toLocaleString('en-US') : '—';

        // Z-Library search link for a textbook. Domain changes often — update here.
        const ZLIB_BASE = 'https://z-library.bz/s/?q=';
        const zlibSearch = (title) => {
            const q = String(title || '').replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
            return ZLIB_BASE + encodeURIComponent(q);
        };

        const CourseRefChip = ({ item, onClick }) => {
            // Codes not in the catalog (legacy / equivalent codes referenced only
            // inside prerequisite rules, e.g. GCLA1903 = old code for UCLC1013).
            // If we know its current-catalog equivalent, link to that instead.
            if (!item.title) {
                if (item.equiv) {
                    return (
                        <button
                            onClick={() => onClick && onClick(item.equiv.code)}
                            title={`旧课程代码，等价于 ${item.equiv.code} ${item.equiv.title}`}
                            className="inline-flex items-center border-2 border-black font-bold text-xs bg-gray-50 transition-all hover:-translate-y-0.5 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
                        >
                            <span className="bg-gray-400 text-white px-1.5 py-1">{item.code}</span>
                            <span className="px-1.5 py-1 text-gray-600">≈ {item.equiv.code}</span>
                            <span className="pr-1.5 py-1 truncate max-w-[9rem] text-gray-500">{item.equiv.title}</span>
                        </button>
                    );
                }
                return (
                    <span title="旧课程代码 / 等价课程，不在课程库中" className="inline-flex items-center border-2 border-black/25 font-bold text-xs bg-gray-50 text-gray-500">
                        <span className="bg-gray-400 text-white px-1.5 py-1">{item.code}</span>
                        <span className="px-1.5 py-1 italic">旧代码</span>
                    </span>
                );
            }
            return (
                <button

            const navTo = (c) => { if (c && c !== code) { setHistory(h => [...h, code]); setShowEnglish(false); setCode(c); } };

            const e = data && data.enrichment;
            const lvl = e && e.difficulty ? Number(e.difficulty.level) || 0 : 0;
            const metaChips = [];
            if (data) {

                if (data.level) metaChips.push(`${data.level} 字头`);
                (data.offering_units || []).forEach(u => metaChips.push(u));
                (data.offering_programmes || []).forEach(p => metaChips.push(p));

                                            <button onClick={goBack} className="bg-white text-black px-2 py-0.5 font-black text-xs border-2 border-white hover:bg-[#d6ff62] flex items-center gap-1"><ArrowRight className="w-3 h-3 rotate-180" /> 返回</button>

                                        <span className="bg-[#d6ff62] text-black px-2 py-0.5 font-black text-lg">{code}</span>
                                        {data && <span className="bg-white/20 px-2 py-0.5 font-bold text-xs border border-white/40">{data.units || '—'} Units</span>}

                                        <div className="flex flex-wrap gap-1.5 mt-4">

                                                    <div className="text-[11px] font-bold text-[#3b82f6] mt-1.5">在 Z-Library 搜索电子版 →</div>

                                            </div>

                                        {e.workload && <p className="text-sm leading-relaxed flex items-start gap-2"><Clock className="w-4 h-4 mt-0.5 shrink-0" />{e.workload}</p>}

                                {/* Prerequisites */}
                                <InsightSection icon={Network} title="前置课要求" accent="#3b82f6">

                                        <p className="font-bold text-gray-500">无前置课要求，可直接选修。</p>
                                    )}
                                </InsightSection>

                                {/* Equivalent / mutually exclusive courses */}
                                {data.equivalents && data.equivalents.length > 0 && (
                                    <InsightSection icon={RefreshCcw} title="等价 / 互斥课程" accent="#eef0f2">
                                        <div className="flex flex-wrap gap-2">
                                            {data.equivalents.map((e, i) => <CourseRefChip key={i} item={e} onClick={navTo} />)}

                                        <p className="text-[11px] text-gray-400 mt-2 font-medium">与本课内容高度重合，通常只能修读其一；部分可等价认定学分（以教务审核为准）</p>
                                    </InsightSection>
                                )}

                                {/* Career & Further study */}
                                {e && e.career && (
                                    <InsightSection icon={Briefcase} title="就业方向" accent="#d6ff62">
                                        <p className="leading-relaxed text-[15px] whitespace-pre-line">{e.career}</p>
                                    </InsightSection>
                                )}

                                {/* Matched careers + salary (SkillPath, from LinkedIn data) */}
                                {data.skillpath && data.skillpath.careers && data.skillpath.careers.length > 0 && (
                                    <InsightSection icon={TrendingUp} title="对口岗位 & 薪资" accent="#a0e7e5">
                                        <div className="space-y-2">
                                            {data.skillpath.careers.map((c, i) => (
                                                <div key={i} className="flex items-center justify-between gap-2 border-2 border-black bg-white px-3 py-2 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <span className="bg-black text-white text-[10px] font-bold px-1.5 py-0.5 shrink-0">{c.faculty}</span>
                                                        <span className="font-black truncate">{c.label}</span>
                                                    </div>
                                                    <span className="font-mono font-bold text-sm shrink-0">{fmtSalary(c.salary_median)}<span className="text-[10px] text-gray-400"> /yr</span></span>
                                                </div>
                                            ))}
                                        </div>
                                        <p className="text-[11px] text-gray-400 mt-2 font-medium">薪资中位数来自 2023-24 LinkedIn（美国市场，USD/年），仅供参考</p>
                                    </InsightSection>
                                )}
                                {e && e.further_study && (
                                    <InsightSection icon={GraduationCap} title="升学 & 科研" accent="#c4b5fd">
                                        <p className="leading-relaxed text-[15px] whitespace-pre-line">{e.further_study}</p>
                                    </InsightSection>
                                )}

                                {/* Recommendation */}
                                {e && (e.recommend_for || e.tips || e.caution) && (
                                    <InsightSection icon={Lightbulb} title="选课建议" accent="#fde047">
                                        {e.recommend_for && <p className="mb-2 text-[15px] leading-relaxed flex items-start gap-2"><Target className="w-4 h-4 mt-1 shrink-0" /><span><span className="font-black">适合：</span>{e.recommend_for}</span></p>}

                                    <InsightSection icon={Users} title="授课老师" accent="#93c5fd">

                                            {data.teachers.map((t, i) => (
                                                <button key={i} onClick={() => onViewTeacher && onViewTeacher(t)} className="inline-flex items-center gap-1.5 bg-white border-2 border-black px-2 py-1 font-bold text-xs hover:bg-[#3b82f6] hover:text-white transition-colors shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                                    <User className="w-3.5 h-3.5" />{t}<ExternalLink className="w-3 h-3 opacity-60" />
                                                </button>
                                            ))}
                                        </div>
                                    </InsightSection>
                                )}

                                {/* Similar courses */}
                                {e && e.similar && e.similar.length > 0 && (
                                    <InsightSection icon={Sparkles} title="相似 & 相关课程" accent="#f0abfc">

                                                    <CourseRefChip item={s} onClick={navTo} />
                                                    {s.reason && <span className="text-sm text-gray-700 pt-1">{s.reason}</span>}
                                                </div>
                                            ))}
                                        </div>
                                    </InsightSection>

                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ description })

        const DDLView = ({ user, onLoginRequest }) => {
            const [todos, setTodos] = useState([]);

            const [syncing, setSyncing] = useState(false);
            const [error, setError] = useState(null);
            const [selectedTodo, setSelectedTodo] = useState(null);
            const [showNotifOptions, setShowNotifOptions] = useState(false);
            const [notificationDraft, setNotificationDraft] = useState({
                email: '',
                enabled: false,
                reminder_hours: [24, 3],
                available_reminder_hours: [72, 24, 3, 1],
                email_service_configured: false,
                unsubscribed_via_link: false
            });
            const [notificationSaving, setNotificationSaving] = useState(false);
            const [notificationTesting, setNotificationTesting] = useState(false);
            const [notificationMessage, setNotificationMessage] = useState(null);
            
            // Filters & Views
            const [viewMode, setViewMode] = useState('active'); // 'active' | 'completed'
            const [filterCourse, setFilterCourse] = useState('');
            const [filterTime, setFilterTime] = useState(''); // 'overdue' | 'today' | '3days' | '7days'
            
            // Manual Add Form
            const [showAddForm, setShowAddForm] = useState(false);
            const [newTodo, setNewTodo] = useState({ title: '', course: '', due_date: '', due_time: '', description: '' });

            useEffect(() => {
                if (user) {
                    fetchTodos();
                    fetchNotificationSettings();
                }
            }, [user]);

            const fetchTodos = async () => {
                setLoading(true);
                try {
                    const res = await fetch('/api/todos');
                    if (res.ok) {
                        const data = await res.json();
                        setTodos(data);
                    }
                } catch (e) { console.error(e); }
                setLoading(false);
            };

            const fetchNotificationSettings = async () => {
                try {
                    const res = await fetch('/api/user/notifications');
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to load notification settings');
                    setNotificationDraft({
                        email: data.email || '',
                        enabled: Boolean(data.enabled),
                        reminder_hours: data.reminder_hours || [24, 3],
                        available_reminder_hours: data.available_reminder_hours || [72, 24, 3, 1],
                        email_service_configured: Boolean(data.email_service_configured),
                        unsubscribed_via_link: Boolean(data.unsubscribed_via_link)
                    });
                } catch (e) {
                    setNotificationMessage({ type: 'error', text: e.message });
                }
            };

            const toggleReminderHour = (hour) => {
                setNotificationDraft(prev => {
                    const exists = prev.reminder_hours.includes(hour);
                    const nextHours = exists
                        ? prev.reminder_hours.filter(item => item !== hour)
                        : [...prev.reminder_hours, hour];
                    return { ...prev, reminder_hours: nextHours.sort((a, b) => b - a) };
                });
            };

            const saveNotificationSettings = async (e) => {
                e.preventDefault();
                setNotificationSaving(true);
                setNotificationMessage(null);
                try {
                    const res = await fetch('/api/user/notifications', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: notificationDraft.email,
                            enabled: notificationDraft.enabled,
                            reminder_hours: notificationDraft.reminder_hours
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to save notification settings');
                    setNotificationDraft(prev => ({
                        ...prev,
                        email: data.settings.email || '',
                        enabled: Boolean(data.settings.enabled),
                        reminder_hours: data.settings.reminder_hours || [24, 3],
                        available_reminder_hours: data.settings.available_reminder_hours || prev.available_reminder_hours,
                        email_service_configured: Boolean(data.settings.email_service_configured),
                        unsubscribed_via_link: Boolean(data.settings.unsubscribed_via_link)
                    }));
                    setNotificationMessage({ type: 'success', text: '邮件通知设置已保存' });
                } catch (e) {
                    setNotificationMessage({ type: 'error', text: e.message });
                }
                setNotificationSaving(false);
            };

            const sendTestNotificationEmail = async () => {
                setNotificationTesting(true);
                setNotificationMessage(null);
                try {
                    const res = await fetch('/api/user/notifications/test', { method: 'POST' });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to send test email');
                    setNotificationMessage({ type: 'success', text: '测试邮件已发送，请检查邮箱' });
                } catch (e) {
                    setNotificationMessage({ type: 'error', text: e.message });
                }
                setNotificationTesting(false);
            };

            const handleSync = async () => {
                if (!user.ispace_username) {
                    alert("Please login with iSpace account first or link your account.");
                    return;
                }
                const password = prompt("Please confirm your iSpace password to sync:");
                if (!password) return;

                setSyncing(true);
                try {
                    const res = await fetch('/api/todos/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: user.ispace_username, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Synced ${data.added} new tasks.`);
                        fetchTodos();
                    } else if (res.status === 403) {
                        alert("当前登录用户绑定的 iSpace 账号与同步账号不一致。请退出后使用正确的 iSpace 账号重新登录，再同步 DDL。");
                    } else {
                        alert(data.error || "Sync failed");
                    }
                } catch (e) { alert("Sync error"); }
                setSyncing(false);
            };
            
            const handleAddTodo = async (e) => {
                e.preventDefault();
                if (!newTodo.title || !newTodo.due_date) return;
                
                // Combine date and time
                const dateStr = newTodo.due_time ? `${newTodo.due_date}T${newTodo.due_time}` : `${newTodo.due_date}T23:59`;
                
                try {
                    const res = await fetch('/api/todos/add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: newTodo.title,
                            course: newTodo.course,
                            description: newTodo.description,
                            due_date: dateStr
                        })
                    });
                    if (res.ok) {
                        setShowAddForm(false);
                        setNewTodo({ title: '', course: '', due_date: '', due_time: '', description: '' });
                        fetchTodos();
                    } else {
                        alert("Failed to add task");
                    }
                } catch(e) { console.error(e); }
            };
            
            const toggleComplete = async (todo) => {
                const endpoint = todo.is_completed ? 'incomplete' : 'complete';
                try {
                    const res = await fetch(`/api/todos/${todo.id}/${endpoint}`, { method: 'POST' });
                    if (res.ok) fetchTodos();
                } catch(e) { console.error(e); }
            };
            
            const deleteTodo = async (id) => {
                if(!confirm("Are you sure you want to delete this task?")) return;
                try {
                    const res = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
                    if (res.ok) fetchTodos();
                } catch(e) { console.error(e); }
            };

            const filteredTodos = useMemo(() => {
                let result = todos;
                
                // Filter by view mode
                if (viewMode === 'active') {
                    result = result.filter(t => !t.is_completed);
                } else {
                    result = result.filter(t => t.is_completed);
                }
                
                // Filter by course
                if (filterCourse) {
                    result = result.filter(t => t.course && t.course.toLowerCase().includes(filterCourse.toLowerCase()));
                }

                // Filter by time
                if (filterTime) {
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000;
                    
                    if (filterTime === 'overdue') {
                         result = result.filter(t => t.due_date < (now.getTime() / 1000));
                    } else if (filterTime === 'today') {
                         result = result.filter(t => {
                             const d = new Date(t.due_date * 1000);
                             return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                         });
                    } else if (filterTime === '3days') {
                         const limit = today + (3 * 24 * 60 * 60);
                         result = result.filter(t => t.due_date >= today && t.due_date <= limit);
                    } else if (filterTime === '7days') {
                         const limit = today + (7 * 24 * 60 * 60);
                         result = result.filter(t => t.due_date >= today && t.due_date <= limit);
                    }
                }
                
                return result;
            }, [todos, viewMode, filterCourse, filterTime]);
            
            const uniqueCourses = useMemo(() => {
                const courses = new Set(todos.map(t => t.course).filter(Boolean));
                return Array.from(courses).sort();
            }, [todos]);

            if (!user) {

                            LOGIN NOW

                                            setShowNotifOptions(!showNotifOptions);
                                            setNotificationMessage(null);

                                        className={`flex items-center gap-2 font-bold border-2 border-black px-3 py-2 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none transition-all ${
                                            notificationDraft.enabled ? 'bg-[#ec4899] text-white hover:bg-pink-600' : 'bg-white hover:text-[#ec4899]'
                                        }`}
                                    >
                                        <Bell className="w-5 h-5" />

            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                let ignore = false;
                setLoading(true);
                setError(null);
                fetch(`/api/classroom/${encodeURIComponent(room)}/schedule`)
                    .then(res => {
                        if (!res.ok) throw new Error('查询失败');
                        return res.json();
                    })
                    .then(d => {
                        if (ignore) return;
                        setData(d);
                        setLoading(false);
                    })
                    .catch(err => {
                        if (ignore) return;
                        setError(err.message || '加载失败');
                        setLoading(false);
                    });
                return () => { ignore = true; };
            }, [room]);

            useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                const prevOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    window.removeEventListener('keydown', onKey);
                    document.body.style.overflow = prevOverflow;
                };
            }, [onClose]);

            const totalEvents = data ? data.total_events : null;

            const scheduleGrid = useMemo(() => {
                if (!data) return null;
                const periodStarts = SCHOOL_PERIODS.map(p => timeToMinutes(p.start));
                const periodEnds = SCHOOL_PERIODS.map(p => timeToMinutes(p.end));
                return data.days.map(day => {
                    const column = SCHOOL_PERIODS.map(() => null);
                    day.events.forEach(event => {
                        let startIdx = periodStarts.indexOf(event.start_min);
                        if (startIdx === -1) {
                            startIdx = periodStarts.findIndex(s => s >= event.start_min);
                            if (startIdx === -1) startIdx = 0;
                        }
                        let endIdx = periodEnds.indexOf(event.end_min);
                        if (endIdx === -1) {
                            for (let i = periodEnds.length - 1; i >= 0; i--) {
                                if (periodEnds[i] <= event.end_min) { endIdx = i; break; }
                            }
                            if (endIdx === -1 || endIdx < startIdx) endIdx = startIdx;
                        }
                        const span = endIdx - startIdx + 1;
                        for (let i = startIdx; i <= endIdx; i++) {
                            if (column[i] === null) {
                                column[i] = { event, isStart: i === startIdx, span };
                            }
                        }
                    });
                    return { day, column };
                });
            }, [data]);

                                <p className="book-serif italic text-[#7a6a5d] text-base text-center py-12">正在翻阅本周课表…</p>

                                    <p className="book-serif text-xl text-[#1a140d]">查询失败</p>

                                </div>

                                <div>
                                    <div className="overflow-x-auto -mx-5 sm:mx-0 px-5 sm:px-0">

                                            <colgroup>

                                                ))}

                                                    <tr key={period.slot}>

                                                            <div>{period.slot}</div>
                                                            <div className="text-[#a08c7d] mt-0.5">{period.start}</div>

                                                        {scheduleGrid.map(({ day, column }) => {
                                                            const cell = column[periodIdx];
                                                            if (cell && !cell.isStart) return null;
                                                            if (!cell) {
                                                                return <td key={day.day} className="empty">·</td>;
                                                            }
                                                            return (
                                                                <td key={day.day} rowSpan={cell.span} className="filled">
                                                                    <div className="code">{cell.event.course_code}</div>
                                                                    {cell.event.title && (
                                                                        <div className="title">{cell.event.title}</div>

                                                                    {cell.event.teacher && (
                                                                        <div className="teacher">{cell.event.teacher}</div>

                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ))}

                                    <p className="book-serif italic text-xs text-[#a08c7d] mt-4 text-center sm:hidden">
                                        左右滑动查看完整一周
                                    </p>
                                </div>
                            )}
