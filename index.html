                                type="button"
                                onClick={onClose}
                                className="w-11 h-11 flex items-center justify-center text-[#7a6a5d] hover:text-[#1a140d] focus:outline-none focus:ring-2 focus:ring-[#1a140d]"
                                aria-label="关闭"
                            >
                                <X className="w-5 h-5" />
                            </button>
                        </div>

                        <div className="mt-6 border-y border-[#1a140d]/15 py-4">
                            <div className="book-serif text-2xl text-[#1a140d]">{room.room}</div>
                            <div className="mono-ui text-xs text-[#7a6a5d] mt-1 tabular-nums">
                                {query.date} · {query.start}–{query.end}
                            </div>
                        </div>

                        {existing ? (
                            <div className="mt-6">
                                <div className="flex items-center justify-between gap-4">
                                    <span className={`mono-ui text-xs uppercase tracking-[0.12em] px-2.5 py-1 border ${
                                        existing.status === 'checked_in'
                                            ? 'bg-[#1a140d] border-[#1a140d] text-white'
                                            : 'border-[#a04a18] text-[#8a3d16]'
                                    }`}>
                                        {existing.status === 'checked_in' ? '已到场' : '已登记'}
                                    </span>
                                    <span className="book-serif text-sm text-[#7a6a5d]">
                                        {purposeLabel} · {existing.party_size}人
                                    </span>
                                </div>

                                <div className="mt-8 flex flex-col-reverse sm:flex-row gap-3">
                                    <button
                                        type="button"
                                        disabled={saving}
                                        onClick={() => runAction('end')}
                                        className="min-h-11 flex-1 border border-[#1a140d]/30 text-[#6f2f1c] book-serif text-base hover:border-[#6f2f1c] disabled:opacity-50 transition-colors"
                                    >
                                        {existing.status === 'checked_in' ? '结束使用' : '取消意向'}
                                    </button>
                                    {existing.can_check_in && (
                                        <button
                                            type="button"
                                            disabled={saving}
                                            onClick={() => runAction('check-in')}
                                            className="min-h-11 flex-1 bg-[#1a140d] text-white book-serif text-base hover:bg-[#3d3025] disabled:opacity-50 transition-colors"
                                        >
                                            {saving ? '处理中…' : '确认到场'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="mt-6">
                                <div className="grid grid-cols-2 gap-5">
                                    <label className="block">
                                        <span className="book-serif text-sm text-[#7a6a5d]">用途</span>
                                        <select
                                            value={purpose}
                                            onChange={event => setPurpose(event.target.value)}
                                            className="room-select mt-2 w-full h-[50px] bg-transparent border-b border-[#1a140d]/30 focus:outline-none focus:border-[#1a140d] book-serif text-base leading-5 text-[#1a140d]"
                                        >
                                            {CLASSROOM_INTENT_PURPOSES.map(item => (
                                                <option key={item.value} value={item.value}>{item.label}</option>
                                            ))}
                                        </select>
                                    </label>
                                    <label className="block">
                                        <span className="book-serif text-sm text-[#7a6a5d]">人数</span>
                                        <input
                                            type="number"
                                            inputMode="numeric"
                                            min="1"
                                            max="50"
                                            value={partySize}
                                            onChange={event => setPartySize(event.target.value)}
                                            className="mt-2 w-full h-[50px] bg-transparent border-b border-[#1a140d]/30 focus:outline-none focus:border-[#1a140d] book-serif text-base leading-5 text-[#1a140d]"
                                        />
                                    </label>
                                </div>
                                <p className="book-serif text-sm text-[#7a6a5d] mt-5">仅作协调，不代表预约。</p>
                                <button
                                    type="button"
                                    disabled={saving || Number(partySize) < 1 || Number(partySize) > 50}
                                    onClick={() => runAction('create')}
                                    className="mt-6 w-full min-h-12 bg-[#1a140d] text-white book-serif text-lg hover:bg-[#3d3025] disabled:opacity-50 transition-colors"
                                >
                                    {saving ? '登记中…' : '登记'}
                                </button>
                            </div>
                        )}

                        {error && (
                            <p role="alert" className="book-serif text-sm text-[#9b2c20] mt-4">{error}</p>
                        )}
                    </section>
                </div>
            );
        };

        const FreeClassroomView = ({ user, onLoginRequest, onSelectRoom }) => {
            const initialQuery = useMemo(() => {
                const DAY_VALUES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const now = new Date();
                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const upcoming = SCHOOL_PERIODS.find(p => timeToMinutes(p.start) >= currentMinutes);
                if (upcoming) {
                    return { day: DAY_VALUES[now.getDay()], start: upcoming.start, end: upcoming.end };
                }
                const nextDay = DAY_VALUES[(now.getDay() + 1) % 7];
                const first = SCHOOL_PERIODS[0];
                return { day: nextDay, start: first.start, end: first.end };
            }, []);

            const [selectedDay, setSelectedDay] = useState(initialQuery.day);
            const [startTime, setStartTime] = useState(initialQuery.start);
            const [endTime, setEndTime] = useState(initialQuery.end);
            const [buildingFilter, setBuildingFilter] = useState('ALL');
            const [roomKeyword, setRoomKeyword] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [result, setResult] = useState(null);
            const [intentRoom, setIntentRoom] = useState(null);
            const [intentRefresh, setIntentRefresh] = useState(0);

            const endOptions = useMemo(() => {
                return SCHOOL_PERIODS.filter(period => timeToMinutes(period.end) > timeToMinutes(startTime));
            }, [startTime]);

            useEffect(() => {
                if (timeToMinutes(endTime) <= timeToMinutes(startTime)) {
                    const firstValidEnd = endOptions[0];
                    if (firstValidEnd) setEndTime(firstValidEnd.end);
                }
            }, [startTime, endTime, endOptions]);

            useEffect(() => {
                let ignore = false;
                const params = new URLSearchParams({ day: selectedDay, start: startTime, end: endTime });

                setLoading(true);
                setError(null);

                fetchJson(`/api/free-classrooms?${params.toString()}`)
                    .then((data) => {
                        if (ignore) return;
                        setResult(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        if (ignore) return;
                        setError(err.message);
                        setLoading(false);
                    });

                return () => {
                    ignore = true;
                };
            }, [selectedDay, startTime, endTime, intentRefresh]);

            const openIntent = (room) => {
                if (!user) {
                    onLoginRequest();
                    return;
                }
                setIntentRoom(room);
            };

            const buildingOptions = useMemo(() => {
                if (!result) return [];
                return result.buildings.filter(item => item.total_rooms > 0);
            }, [result]);

            const filteredRooms = useMemo(() => {
                if (!result) return [];
                const keyword = roomKeyword.trim().toLowerCase();
                return result.rooms.filter(room => {
                    const byBuilding = buildingFilter === 'ALL' || room.building === buildingFilter;
                    const byKeyword = !keyword || room.room.toLowerCase().includes(keyword);
                    return byBuilding && byKeyword;
                });
            }, [result, buildingFilter, roomKeyword]);

            const groupedRooms = useMemo(() => {
                const groups = {};
                filteredRooms.forEach(room => {
                    const location = getRoomLocationMeta(room.room);

                    if (!groups[room.building]) {
                        groups[room.building] = {
                            building: room.building,
                            roomCount: 0,
                            floors: {},
                        };
                    }

                    if (!groups[room.building].floors[location.floorLabel]) {
                        groups[room.building].floors[location.floorLabel] = {
                            floorLabel: location.floorLabel,
                            floorNumber: location.floorNumber,
                            rooms: [],
                        };
                    }

                    groups[room.building].roomCount += 1;
                    groups[room.building].floors[location.floorLabel].rooms.push({
                        ...room,
                        location,
                    });
                });

                return Object.values(groups)
                    .map(group => ({
                        ...group,
                        floors: Object.values(group.floors)
                            .map(floorGroup => ({
                                ...floorGroup,
                                rooms: floorGroup.rooms.sort((a, b) => compareRoomCode(a.room, b.room)),
                            }))
                            .sort((a, b) => {
                                if (a.floorNumber === null && b.floorNumber === null) return 0;
                                if (a.floorNumber === null) return 1;
                                if (b.floorNumber === null) return -1;
                                return a.floorNumber - b.floorNumber;
                            }),
                    }))
                    .sort((a, b) => compareBuildingOrder(a.building, b.building));
            }, [filteredRooms]);

            const summaryFree = result ? result.summary.free_rooms : '--';
            const summaryOccupied = result ? result.summary.occupied_rooms : '--';
            const summaryTotal = result ? result.summary.total_rooms : '--';
            const queryLabel = result
                ? `${result.query.date.slice(5).replace('-', '/')} · ${result.query.day_label} · ${result.query.start} – ${result.query.end}`
                : 'Loading...';

            const headlineNumber = loading ? '–' : error ? '!' : filteredRooms.length;
            const headlineSubtitle = loading ? '正在翻阅空闲教室…' : error ? '查询失败' : '间空闲教室 · 当前时段';

            return (
                <div className="relative min-h-[calc(100svh-86px)]">
                    <section className="max-w-5xl mx-auto px-5 sm:px-6 md:px-10 py-8 md:py-14">
                        <div className="mono-ui text-[10px] sm:text-[11px] uppercase tracking-[0.24em] sm:tracking-[0.28em] text-[#8a7666]">
                            MAXCOURSE · Empty Classroom Index
                        </div>
                        <hr className="book-divider mt-4" />

                        <header className="mt-8 md:mt-12 grid md:grid-cols-[minmax(0,1fr)_auto] gap-3 md:gap-6 md:items-end">
                            <div>
                                <div className="book-serif text-[#7a6a5d] italic text-base md:text-lg">
                                    A directory of quiet rooms,
                                </div>
                                <h1 className="book-serif mt-2 text-[clamp(2rem,5.5vw,3.75rem)] font-normal leading-[1.05] tracking-[0.02em] text-[#1a140d]">
                                    Empty Classrooms
                                </h1>
                            </div>
                            <div className="mono-ui text-[10px] sm:text-[11px] uppercase tracking-[0.24em] sm:tracking-[0.28em] text-[#a08c7d] md:text-right">
                                {queryLabel}
                            </div>
                        </header>

                        <article className="mt-12">
                            <div className="flex items-baseline justify-between mb-3">
                                <div className="book-serif italic text-[#7a6a5d] text-sm">§ I. Query</div>
                                <div className="mono-ui text-[10px] uppercase tracking-[0.22em] text-[#a08c7d]">
                                    Day · Period
                                </div>
                            </div>
                            <hr className="book-divider-thin" />

                            <div className="mt-6">
                                <div className="book-serif italic text-sm text-[#7a6a5d] mb-3">选择周几</div>
                                <div className="flex flex-wrap gap-x-5 gap-y-3">
                                    {SCHOOL_DAY_OPTIONS.map((day) => (
                                        <button
                                            key={day.value}
                                            onClick={() => setSelectedDay(day.value)}
                                            className={`book-serif text-base md:text-lg pb-1 transition-colors border-b ${
                                                selectedDay === day.value
                                                    ? 'text-[#1a140d] border-[#1a140d]'
                                                    : 'text-[#7a6a5d] border-transparent hover:text-[#1a140d] hover:border-[#1a140d]/40'
                                            }`}
                                        >
                                            {day.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="mt-7 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-x-6 md:gap-x-8 gap-y-5">
                                <div>
                                    <label className="book-serif italic text-sm text-[#7a6a5d]">起始时间</label>
                                    <select
                                        value={startTime}
                                        onChange={(e) => setStartTime(e.target.value)}
                                        className="room-select mt-2 w-full bg-transparent border-b border-[#1a140d]/30 focus:outline-none focus:border-[#1a140d] py-2 pr-10 book-serif text-lg text-[#1a140d]"
                                        style={{ color: '#1a140d', backgroundColor: 'transparent' }}
                                    >
                                        {SCHOOL_PERIODS.map(period => (
                                            <option key={period.start} value={period.start} style={{ color: '#1a140d', backgroundColor: '#fbf7ef' }}>
                                                {period.slot} · {period.start}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="book-serif italic text-sm text-[#7a6a5d]">结束时间</label>
                                    <select
                                        value={endTime}
                                        onChange={(e) => setEndTime(e.target.value)}
                                        className="room-select mt-2 w-full bg-transparent border-b border-[#1a140d]/30 focus:outline-none focus:border-[#1a140d] py-2 pr-10 book-serif text-lg text-[#1a140d]"
                                        style={{ color: '#1a140d', backgroundColor: 'transparent' }}
                                    >
                                        {endOptions.map(period => (
                                            <option key={period.end} value={period.end} style={{ color: '#1a140d', backgroundColor: '#fbf7ef' }}>
                                                {period.slot} · {period.end}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="book-serif italic text-sm text-[#7a6a5d]">教学楼</label>
                                    <select
                                        value={buildingFilter}
                                        onChange={(e) => setBuildingFilter(e.target.value)}
                                        className="room-select mt-2 w-full bg-transparent border-b border-[#1a140d]/30 focus:outline-none focus:border-[#1a140d] py-2 pr-10 book-serif text-lg text-[#1a140d]"
                                        style={{ color: '#1a140d', backgroundColor: 'transparent' }}
                                    >
                                        <option value="ALL" style={{ color: '#1a140d', backgroundColor: '#fbf7ef' }}>全部</option>
                                        {buildingOptions.map(item => (
                                            <option key={item.building} value={item.building} style={{ color: '#1a140d', backgroundColor: '#fbf7ef' }}>
                                                {item.building} · {item.free_rooms}/{item.total_rooms}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="book-serif italic text-sm text-[#7a6a5d]">房间号</label>
                                    <input
                                        type="text"
                                        value={roomKeyword}
                                        onChange={(e) => setRoomKeyword(e.target.value)}
                                        placeholder="例如 T4 或 603"
                                        className="mt-2 w-full bg-transparent border-b border-[#1a140d]/30 focus:outline-none focus:border-[#1a140d] py-2 book-serif text-lg text-[#1a140d] placeholder:text-[#a08c7d] placeholder:italic"
                                    />
                                </div>
                            </div>
                        </article>

                        <article className="mt-14">
                            <div className="flex items-baseline justify-between mb-3">
                                <div className="book-serif italic text-[#7a6a5d] text-sm">§ II. Survey</div>
                                <div className="mono-ui text-[10px] uppercase tracking-[0.22em] text-[#a08c7d]">
                                    Free · Occupied · Total
                                </div>
                            </div>
                            <hr className="book-divider-thin" />

                            <div className="mt-6 flex flex-col sm:flex-row sm:items-baseline gap-3 sm:gap-6 md:gap-8">
                                <span className="book-serif text-[clamp(3.25rem,13vw,7rem)] leading-none text-[#1a140d] tracking-[0.01em]">
                                    {headlineNumber}
                                </span>
                                <div className="sm:pb-2">
                                    <div className="book-serif text-lg md:text-xl text-[#1a140d]">
                                        {headlineSubtitle}
                                    </div>
                                    <div className="book-serif italic text-xs sm:text-sm text-[#7a6a5d] mt-1.5 leading-relaxed">
                                        Free <span className="text-[#1a140d] not-italic">{summaryFree}</span>
                                        <span className="mx-1.5 sm:mx-2 text-[#a08c7d]">·</span>
                                        Occupied <span className="text-[#1a140d] not-italic">{summaryOccupied}</span>
                                        <span className="mx-1.5 sm:mx-2 text-[#a08c7d]">·</span>
                                        Inventory <span className="text-[#1a140d] not-italic">{summaryTotal}</span>
                                    </div>
                                </div>
                            </div>
                        </article>

                        <article className="mt-14">
                            <div className="flex items-baseline justify-between mb-3">
                                <div className="book-serif italic text-[#7a6a5d] text-sm">§ III. Rooms</div>
                                <div className="mono-ui text-[10px] uppercase tracking-[0.22em] text-[#a08c7d]">
                                    {groupedRooms.length} {groupedRooms.length === 1 ? 'building' : 'buildings'}
                                </div>
                            </div>
                            <hr className="book-divider" />

                            {loading ? (
                                <p className="book-serif italic text-[#7a6a5d] text-base mt-12 text-center">正在计算空闲教室…</p>
                            ) : error ? (
                                <div className="mt-10">
                                    <p className="book-serif text-xl text-[#1a140d]">查询失败</p>
                                    <p className="book-serif italic text-sm text-[#7a6a5d] mt-2">{error}</p>
                                </div>
                            ) : groupedRooms.length === 0 ? (
                                <div className="mt-12 text-center">
                                    <p className="book-serif text-xl md:text-2xl text-[#1a140d]">这个时段没有符合条件的空教室</p>
                                    <p className="book-serif italic text-sm text-[#7a6a5d] mt-3">换一个时间段、楼栋或者搜索条件试试。</p>
                                </div>
                            ) : (
                                <div>
                                    {groupedRooms.map((group, idx) => (
                                        <section key={group.building} className="mt-12 first:mt-8">
                                            <div className="flex items-baseline gap-3 md:gap-4 flex-wrap">
                                                <span className="book-serif italic text-[#a08c7d] text-lg md:text-xl">
                                                    {toRoman(idx + 1)}.
                                                </span>
                                                <h2 className="book-serif text-2xl md:text-3xl lg:text-4xl text-[#1a140d] tracking-[0.01em]">
                                                    {group.building}
                                                </h2>
                                                <span className="book-serif italic text-sm text-[#7a6a5d] ml-auto whitespace-nowrap">
                                                    {group.roomCount} {group.roomCount === 1 ? 'room' : 'rooms'}
                                                </span>
                                            </div>
                                            <hr className="book-divider-thin mt-3" />

                                            {group.floors.map((floorGroup) => (
                                                <div key={`${group.building}-${floorGroup.floorLabel}`} className="mt-7">
                                                    <div className="book-serif italic text-sm text-[#a08c7d] mb-4 tracking-[0.02em]">
                                                        — {floorGroup.floorLabel} <span className="text-[#a08c7d]/70">· {floorGroup.rooms.length} 间</span>
                                                    </div>
                                                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-6">
                                                        {floorGroup.rooms.map((room) => {
                                                            const intent = room.intent || {};
                                                            const hasIntent = (intent.people || 0) > 0;
                                                            const purposeText = intent.purposes?.length === 1
                                                                ? CLASSROOM_INTENT_PURPOSES.find(item => item.value === intent.purposes[0])?.label || ''
                                                                : intent.purposes?.length > 1 ? '多用途' : '';
                                                            const presenceText = intent.checked_in_people > 0
                                                                ? `已到场 ${intent.checked_in_people}人${intent.planned_people > 0 ? ` · 计划 ${intent.planned_people}人` : ''}`
                                                                : intent.planned_people > 0
                                                                    ? `计划 ${intent.planned_people}人`
                                                                    : '';
                                                            const statusText = presenceText && purposeText
                                                                ? `${presenceText} · ${purposeText}`
                                                                : presenceText;
                                                            const registrationState = result?.query?.registration_state
                                                                || (result?.query?.registration_open ? 'open' : 'past');
                                                            const registrationOpen = registrationState === 'open'
                                                                || result?.query?.registration_open === true;
                                                            const canOpenIntent = Boolean(intent.my) || registrationOpen;
                                                            const registrationLabel = registrationState === 'past' ? '时段已过' : '已开始';

                                                            return (
                                                                <div
                                                                    key={room.room}
                                                                    className="relative border-t border-[#1a140d]/15 pt-3 -mx-2 px-2 -mt-1 pb-3"
                                                                >
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => onSelectRoom && onSelectRoom(room.room)}
                                                                        className="w-full pr-24 sm:pr-28 text-left transition-colors hover:bg-[#1a140d]/[0.025] focus:outline-none focus:ring-2 focus:ring-[#1a140d]/50 cursor-pointer"
                                                                        aria-label={`查看 ${room.room} 课表`}
                                                                    >
                                                                        <div className="book-serif text-2xl md:text-[1.65rem] text-[#1a140d] tracking-[0.01em] leading-tight">
                                                                            {room.room}
                                                                        </div>
                                                                        <div className="book-serif mt-2 text-lg md:text-xl text-[#1a140d]">
                                                                            <span className="italic text-[#7a6a5d] text-base">空闲至 </span>
                                                                            <span className="text-[#a04a18]">{room.free_until}</span>
                                                                        </div>
                                                                        <div className="book-serif text-xs text-[#7a6a5d] mt-2 leading-relaxed">
                                                                            {room.next_busy ? (
                                                                                <React.Fragment>
                                                                                    <span className="italic">下一节 {room.next_busy.start}–{room.next_busy.end}</span>
                                                                                    <span className="block mt-0.5 text-[#3d3025]">{room.next_busy.course_code} · {room.next_busy.title}</span>
                                                                                </React.Fragment>
                                                                            ) : (
                                                                                <span className="italic">今天后续没有排课</span>
                                                                            )}
                                                                        </div>
                                                                    </button>

                                                                    <button
                                                                        type="button"
                                                                        disabled={!canOpenIntent}
                                                                        onClick={() => openIntent(room)}
                                                                        className={`group/intent absolute top-1 right-1 min-h-11 px-1 inline-flex items-center gap-1 book-serif italic text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-[#1a140d]/60 focus:ring-offset-2 focus:ring-offset-[#fbf7ef] ${
                                                                            intent.my || hasIntent
                                                                                ? 'text-[#8a3d16] hover:text-[#5f260f]'
                                                                                : 'text-[#7a6a5d] hover:text-[#1a140d]'
                                                                        } disabled:opacity-35 disabled:cursor-not-allowed`}
                                                                    >
                                                                        <span>{intent.my ? '我的意向' : registrationOpen ? '登记意向' : registrationLabel}</span>
                                                                        <ArrowRight className="w-3.5 h-3.5 transition-transform group-hover/intent:translate-x-0.5" aria-hidden="true" />
                                                                    </button>

                                                                    {statusText && (
                                                                        <div className="mt-3 flex items-center gap-2 book-serif italic text-sm text-[#8a3d16]">
                                                                            <span className="w-5 h-px bg-[#a04a18]/60 shrink-0" aria-hidden="true" />
                                                                            <span>{statusText}</span>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </section>
                                    ))}
                                </div>
                            )}
                        </article>

                        <footer className="mt-20 md:mt-28 text-center">
                            <hr className="book-divider-thin mb-6" />
                            <div className="mono-ui text-[10px] uppercase tracking-[0.24em] text-[#a08c7d]">
                                · Fin ·
                            </div>
                        </footer>
                    </section>
                    {intentRoom && result?.query && (
                        <ClassroomIntentModal
                            room={intentRoom}
                            query={result.query}
                            onClose={() => setIntentRoom(null)}
                            onChanged={() => setIntentRefresh(value => value + 1)}

        const SettingsView = ({ user, onLogout }) => {
            const [deleting, setDeleting] = useState(false);
            const [displayName, setDisplayName] = useState(user ? (user.display_name || user.username) : '');
            const [updating, setUpdating] = useState(false);
            const [bindSid, setBindSid] = useState('');
            const [bindPw, setBindPw] = useState('');
            const [binding, setBinding] = useState(false);

            const handleBindIspace = async () => {
                if (!bindSid.trim() || !bindPw) { alert("请输入学号和 iSpace 密码"); return; }
                setBinding(true);
                try {
                    const res = await fetch('/api/user/bind/ispace', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: bindSid.trim(), password: bindPw })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert("绑定成功！今后可直接用 iSpace 登录此账号，DDL 已同步。");
                        window.location.reload();
                    } else {
                        alert("绑定失败: " + (data.error || "Unknown error"));
                    }
                } catch (e) {
                    alert("Network error");
                }
                setBinding(false);
            };

            useEffect(() => {
                if (user) setDisplayName(user.display_name || user.username);
            }, [user]);

            const handleUpdateProfile = async () => {
                if (!displayName.trim()) {
                    alert("Display name cannot be empty");
                    return;
                }
                setUpdating(true);
                try {
                    const res = await fetch('/api/user/profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ display_name: displayName })
                    });
                    if (res.ok) {
                        alert("Profile updated successfully!");
                        // Ideally we should update the parent user state, but a page refresh or re-fetch will do.
                        // For better UX, we can trigger a reload or callback.
                        window.location.reload(); 
                    } else {
                        const data = await res.json();
                        alert("Update failed: " + (data.error || "Unknown error"));
                    }
                } catch (e) {
                    alert("Network error");
                }
                setUpdating(false);
            };

            useEffect(() => {
                let alive = true;
                fetch('/api/campus-docs')

            const q = query.trim().toLowerCase();
            const categories = (data && data.categories) || [];
            const filtered = useMemo(() => {
                if (!q) return categories;
                const codeQuery = /^[a-z0-9]{1,4}$/.test(q);
                const matchesQuery = (value) => {
                    const normalized = String(value || '').toLowerCase();
                    return codeQuery
                        ? normalized.split(/[^a-z0-9]+/).includes(q)
                        : normalized.includes(q);
                };
                return categories
                    .map(cat => {
                        const docs = cat.docs || [];
                        const categoryMatches =
                            matchesQuery(cat.title) || matchesQuery(cat.desc);
                        return {
                            ...cat,
                            docs: categoryMatches ? docs : docs.filter(doc =>
                                matchesQuery(doc.title) ||
                                matchesQuery(doc.desc) ||
                                matchesQuery(doc.meta) ||
                                (doc.keywords || []).some(matchesQuery))

                    {!loading && !error && (

                                >
                                    <div className="flex items-start gap-4">
                                        <div className="grid h-12 w-12 shrink-0 place-items-center rounded-2xl border border-black/10 bg-[#101820] text-white shadow-[4px_4px_0px_rgba(16,24,32,1)]">

        // --- Auth Modal ---
        const AuthModal = ({ onClose, onLoginSuccess }) => {
            const [activeTab, setActiveTab] = useState('login'); // login, register, ispace
            const [formData, setFormData] = useState({ username: '', password: '' });

            const handleSubmit = async (e) => {

                setLoading(true);
                setError(null);
                
                let url = '/api/login';
                if (activeTab === 'register') url = '/api/register';
                if (activeTab === 'ispace') url = '/api/login/ispace';

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    const data = await res.json();
                    
                    if (res.ok) {
                        if (activeTab === 'register') {
                            alert("Registration successful! Please login.");
                            setActiveTab('login');
                        } else {
                            onLoginSuccess(data.user);
                            onClose();
                        }
                    } else {
                        setError(data.error || 'Operation failed');
                    }
                } catch (err) {
                    setError('Network error');
                }
                setLoading(false);

                        <h2 className="text-3xl font-black mb-6 uppercase text-center">

                        <div className="flex border-b-4 border-black mb-6">

                            <button onClick={() => setActiveTab('register')} className={`flex-1 py-2 font-bold ${activeTab === 'register' ? 'bg-black text-white' : 'hover:bg-gray-100'}`}>REGISTER</button>
                            <button onClick={() => setActiveTab('ispace')} className={`flex-1 py-2 font-bold ${activeTab === 'ispace' ? 'bg-[#3b82f6] text-white border-l-2 border-black' : 'hover:bg-gray-100 border-l-2 border-black'}`}>iSPACE</button>

                                    onChange={e => setFormData({...formData, username: e.target.value})}
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-black uppercase mb-1">Password</label>
                                <input 
                                    type="password" 
                                    required 
                                    className="w-full border-2 border-black p-3 font-bold focus:bg-[#ec4899] focus:text-white focus:outline-none transition-colors"
                                    value={formData.password}
                                    onChange={e => setFormData({...formData, password: e.target.value})}
                                />
                            </div>
                            {error && <div className="bg-red-100 border-2 border-red-500 text-red-700 p-2 text-sm font-bold text-center">{error}</div>}
                            
                            {(activeTab === 'login' || activeTab === 'register') && (
                                <button 
                                    type="button"
                                    onClick={() => setActiveTab('ispace')}
                                    className="w-full bg-[#3b82f6] text-white font-bold py-3 rounded-full border-2 border-black hover:bg-blue-600 hover:scale-105 transition-all mb-2 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:shadow-none flex justify-center items-center gap-2"
                                >

                        {activeTab === 'ispace' && (

        const FACULTY_LABEL = { FST: '理工 FST', FBM: '工商管理 FBM', FHSS: '人文社科 FHSS', SCC: '文化创意 SCC', Science: '理科', Cross: '通用' };

        const SECTION_ACCENTS = ['#d6ff62', '#a0e7e5', '#fde047', '#f0abfc', '#fdba74', '#93c5fd'];

        const PlanCourseChip = ({ c, onViewCourse }) => (
            <button
                onClick={() => c.in_catalog && onViewCourse && onViewCourse(c.code)}
                title={`${c.code} ${c.title}${c.via ? ` · 以 ${c.via} 等价认定` : ''}${c.plan && c.plan.length ? ` · 建议 Y${c.plan[0][0]}S${c.plan[0][1]}` : ''}`}
                className={`inline-flex items-center gap-1.5 border-2 text-left font-bold text-xs transition-all ${c.in_catalog ? 'border-black hover:-translate-y-0.5 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]' : 'border-black/30 cursor-default'} ${c.completed ? 'bg-[#d6ff62]' : 'bg-white'}`}
            >
                <span className={`px-1.5 py-1 text-white ${c.completed ? 'bg-black' : c.in_catalog ? 'bg-black/80' : 'bg-gray-400'}`}>{c.code}</span>
                <span className="truncate max-w-[10rem] py-1">{c.title}</span>
                {c.via && <span className="mr-1 shrink-0 text-[10px] bg-black text-[#d6ff62] px-1 py-0.5" title={`已修 ${c.via}，按等价课认定`}>≈{c.via}</span>}
                {c.completed && <Check className="w-3.5 h-3.5 mr-1.5 shrink-0" />}
                {!c.completed && c.plan && c.plan.length > 0 && <span className="mr-1.5 text-[10px] text-gray-400 shrink-0">Y{c.plan[0][0]}S{c.plan[0][1]}</span>}
            </button>
        );

        const ProgrammeMapView = ({ onViewCourse }) => {
            const [programmes, setProgrammes] = useState([]);
            const [programme, setProgramme] = useState('');
            const [cohort, setCohort] = useState('');
            const [completedText, setCompletedText] = useState('');
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [uploading, setUploading] = useState(false);
            const [parseMsg, setParseMsg] = useState('');
            const [openPools, setOpenPools] = useState({});

            const parseCodes = (text) => text.split(/[,，\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);

            useEffect(() => {
                fetch('/api/programmes').then(r => r.json()).then(d => setProgrammes(d.programmes || [])).catch(() => {});
                try {
                    const saved = JSON.parse(localStorage.getItem('maxcourse_programme_profile') || 'null');
                    if (saved && saved.programme) {
                        setProgramme(saved.programme);
                        setCohort(saved.cohort || '');
                        setCompletedText(saved.completed || '');
                        if (saved.cohort) runMap(saved.programme, saved.cohort, parseCodes(saved.completed || ''));
                    }
                } catch (e) {}
            }, []);

            const selectedProg = programmes.find(p => p.key === programme);
            const grouped = useMemo(() => {
                const g = {};
                programmes.forEach(p => { (g[p.faculty] = g[p.faculty] || []).push(p); });
                return g;
            }, [programmes]);

            const runMap = async (prog, coh, completed) => {
                if (!prog || !coh) { setError('请先选择专业和入学年份'); return; }
                setLoading(true); setError('');
                try {
                    const res = await fetch('/api/programme-map', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ programme: prog, cohort: coh, completed })
                    });
                    const d = await res.json();
                    if (!res.ok) throw new Error(d.error || '加载失败');
                    setData(d);
                    try { localStorage.setItem('maxcourse_programme_profile', JSON.stringify({ programme: prog, cohort: coh, completed: completed.join(', ') })); } catch (e) {}
                } catch (e) { setError(e.message || '加载失败'); setData(null); }
                setLoading(false);
            };

            const handleTranscriptUpload = async (ev) => {
                const file = ev.target.files && ev.target.files[0];
                ev.target.value = '';
                if (!file) return;
                setUploading(true); setParseMsg(''); setError('');
                try {
                    const fd = new FormData();
                    fd.append('file', file);
                    const res = await fetch('/api/parse-transcript', { method: 'POST', body: fd });
                    const d = await res.json();
                    if (!res.ok) throw new Error(d.error || '解析失败');
                    if (!d.codes || d.codes.length === 0) {
                        setParseMsg('未从文件中识别到已修课程。');
                    } else {
                        setCompletedText(d.codes.join(', '));
                        setParseMsg(`已从成绩单解析出 ${d.count} 门已修课程。`);
                        if (programme && cohort) runMap(programme, cohort, d.codes);
                    }
                } catch (err) { setError(err.message || '成绩单解析失败'); }
                setUploading(false);
            };

                setUploading(true); setParseMsg(''); setError('');
                try {
                    const fd = new FormData();
                    fd.append('file', file);
                    const res = await fetch('/api/parse-transcript', { method: 'POST', body: fd });
                    const d = await res.json();
                    if (!res.ok) throw new Error(d.error || '解析失败');
                    if (!d.codes || d.codes.length === 0) {
                        setParseMsg('未从文件中识别到已修课程，请确认上传的是成绩单或毕业审核报告 PDF。');
                    } else {
                        setCompletedText(d.codes.join(', '));
                        const ignored = (d.count || 0) - (d.recognized_count || 0);
                        setParseMsg(`已从成绩单解析出 ${d.count} 门已修课程` + (ignored > 0 ? `（其中 ${ignored} 门不在课程库中，仅供参考）` : '') + '。');

                        body: JSON.stringify({ career, completed, offered_only: offeredOnly, limit: 12 })

        // 排课结果的周课表:天为列、时间为行,课程块按起止时间绝对定位。
        // 求解器保证无时间冲突,所以同一列内不会有块重叠。
        const DAY_ZH = { Mon: '周一', Tue: '周二', Wed: '周三', Thu: '周四', Fri: '周五', Sat: '周六', Sun: '周日' };
        const WeeklyTimetable = ({ slots }) => {
            if (!slots || slots.length === 0) return null;
            const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
            const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const used = new Set(slots.map(s => s.day));
            // 周一到周五常驻,周末只在真的有课时出现
            const days = WEEK.filter(d => !['Sat', 'Sun'].includes(d) || used.has(d));
            const startH = Math.floor(Math.min(...slots.map(s => toMin(s.start))) / 60);
            const endH = Math.ceil(Math.max(...slots.map(s => toMin(s.end))) / 60);
            const HOUR_PX = 56;
            const bodyH = (endH - startH) * HOUR_PX;
            const hours = [];
            for (let h = startH; h <= endH; h++) hours.push(h);
            return (
                <div className="bg-white border-4 border-black overflow-x-auto">
                    <div style={{ minWidth: 90 * days.length + 56 }}>
                        <div className="grid" style={{ gridTemplateColumns: `56px repeat(${days.length}, 1fr)` }}>
                            <div className="bg-black border-b-4 border-black"></div>
                            {days.map(d => (
                                <div key={d} className="bg-black text-white text-center font-black py-2 text-sm border-b-4 border-l-2 border-black">{DAY_ZH[d]}</div>
                            ))}
                            <div className="relative" style={{ height: bodyH }}>
                                {hours.map(h => (
                                    <div key={h} className="absolute right-1 text-[10px] font-bold text-gray-500" style={{ top: Math.max(0, (h - startH) * HOUR_PX - 7) }}>{String(h).padStart(2, '0')}:00</div>
                                ))}
                            </div>
                            {days.map(d => (
                                <div key={d} className="relative border-l-2 border-black" style={{ height: bodyH, backgroundImage: 'linear-gradient(to bottom, rgba(0,0,0,0.10) 1px, transparent 1px)', backgroundSize: `100% ${HOUR_PX}px` }}>
                                    {slots.filter(s => s.day === d).map((s, i) => {
                                        const top = (toMin(s.start) - startH * 60) / 60 * HOUR_PX;
                                        const height = (toMin(s.end) - toMin(s.start)) / 60 * HOUR_PX;
                                        return (
                                            <div key={`${s.id}-${i}`} className={`absolute left-0.5 right-0.5 ${s.color} border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] p-1 overflow-hidden`} style={{ top, height }} title={`${s.courseCode} ${s.courseName}\n${s.start}-${s.end}${s.room ? ' · ' + s.room : ''}${s.teacher ? '\n' + s.teacher : ''}`}>
                                                <div className="text-[11px] font-black leading-tight truncate">{s.courseCode}</div>
                                                <div className="text-[10px] font-bold leading-tight">{s.start}-{s.end}</div>
                                                {s.room && <div className="text-[10px] font-bold leading-tight truncate">{s.room}</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {

            const [newBlockDay, setNewBlockDay] = useState("Mon");

            const [newBlockEnd, setNewBlockEnd] = useState("10:00");
            const [optimalSchedule, setOptimalSchedule] = useState(null);
            const [isCalculating, setIsCalculating] = useState(false);
            const [loadingCourses, setLoadingCourses] = useState(true);
            const [error, setError] = useState(null);

            const [user, setUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);

            const mobileMenuRef = useRef(null);
            useEffect(() => {

            }, [currentView]);

            const logout = () => {
                fetch('/api/logout', { method: 'POST' }).then(() => {
                    setUser(null);
                    setCurrentView('home');
                    setIsMenuOpen(false);
                });
            };

            const goToView = (view) => {
                setCurrentView(view);
                setIsMenuOpen(false);
            };

            const filteredCourses = useMemo(() => {
                if (!searchQuery) return [];
                return availableCourses.filter(c => 
                    String(c.code).toLowerCase().includes(searchQuery.toLowerCase()) || 
                    String(c.name).toLowerCase().includes(searchQuery.toLowerCase())
                ).slice(0, 10);
            }, [searchQuery, availableCourses]);

            const teacherCount = useMemo(() => {
                const teachers = new Set();
                availableCourses.forEach(course => {
                    (course.teachers || []).forEach(teacher => {
                        const name = String(teacher || '').trim();
                        if (name) teachers.add(name);
                    });
                });
                return teachers.size;
            }, [availableCourses]);

            const navItems = [
                { key: 'home', label: '主页', Icon: House },
                { label: '选课', Icon: BookOpen, children: [
                    { key: 'explorer', label: '课程', Icon: BookOpen },
                    { key: 'optimizer', label: '排课', Icon: Calculator },
                    { key: 'programme', label: '专业地图', Icon: Layers, wip: true },
                    { key: 'career', label: '职业规划', Icon: Briefcase, wip: true },
                ] },
                { key: 'classrooms', label: '空教室', Icon: Building2 },
                { key: 'ddl', label: 'DDL', Icon: CheckSquare },
                { key: 'teachers', label: '老师', Icon: UserCheck },
                { key: 'toolbox', label: '工具箱', Icon: Wrench },
                { key: 'settings', label: '设置', Icon: Settings }
            ];

            const addCourse = (course, preferredTeacher = "") => {
                const existing = selectedCodes.find(c => c.code === course.code);
                if (existing) {
                    if (preferredTeacher && existing.preferredTeacher !== preferredTeacher) {
                         updatePreferredTeacher(course.code, preferredTeacher);
                    }
                    return;
                }
                const randomColor = ['bg-pink-400', 'bg-lime-400', 'bg-cyan-400', 'bg-yellow-400', 'bg-orange-400', 'bg-purple-400', 'bg-emerald-400', 'bg-rose-400'][selectedCodes.length % 8];
                let teacherList = course.teachers || [];
                if (teacherList.length === 0 && availableCourses.length > 0) {
                     const found = availableCourses.find(ac => ac.code === course.code);
                     if (found && found.teachers) teacherList = found.teachers;
                }
                setSelectedCodes([...selectedCodes, { ...course, color: randomColor, preferredTeacher: preferredTeacher, teachers: teacherList }]);
                setSearchQuery("");
                setOptimalSchedule(null);
            };

            const CART_COLORS = ['bg-pink-400', 'bg-lime-400', 'bg-cyan-400', 'bg-yellow-400', 'bg-orange-400', 'bg-purple-400', 'bg-emerald-400', 'bg-rose-400'];
            const addCourses = (list) => {
                setSelectedCodes(prev => {
                    const have = new Set(prev.map(c => c.code));
                    const additions = [];
                    (list || []).forEach(item => {
                        if (!item || !item.code || have.has(item.code)) return;
                        have.add(item.code);
                        const found = availableCourses.find(ac => ac.code === item.code);
                        additions.push({
                            code: item.code,
                            name: item.name || item.title || (found ? found.name : item.code),
                            color: CART_COLORS[(prev.length + additions.length) % CART_COLORS.length],
                            preferredTeacher: '',
                            teachers: found && found.teachers ? found.teachers : [],
                        });
                    });
                    return additions.length ? [...prev, ...additions] : prev;
                });
                setOptimalSchedule(null);
            };

            const updatePreferredTeacher = (code, teacher) => {
                setSelectedCodes(selectedCodes.map(c => c.code === code ? { ...c, preferredTeacher: teacher } : c));
                setOptimalSchedule(null);
            };

            const removeCourse = (code) => {
                setSelectedCodes(selectedCodes.filter(c => c.code !== code));
                setOptimalSchedule(null);
            };
            
            const addBlockedSlot = () => {
                setBlockedSlots([...blockedSlots, { day: newBlockDay, start: newBlockStart, end: newBlockEnd, id: Date.now() }]);
            };
            const removeBlockedSlot = (id) => setBlockedSlots(blockedSlots.filter(b => b.id !== id));

            const calculateOptimal = () => {
                setIsCalculating(true);
                setOptimalSchedule(null);
                const teachersMap = {};
                selectedCodes.forEach(c => { if (c.preferredTeacher) teachersMap[c.code] = c.preferredTeacher; });

                fetch('/api/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codes: selectedCodes.map(c => c.code), startTime, endTime, blocked: blockedSlots, teachers: teachersMap })
                })
                .then(res => res.json())
                .then(data => {
                    setIsCalculating(false);
                    if (data.error) { alert(data.error); return; }
                    if (!data.found) { alert("无法找到不冲突的组合！\n缺失课程: " + (data.missing || []).join(", ")); return; }
                    
                    const coloredCourses = data.courses.map((c) => {
                        const original = selectedCodes.find(sc => sc.code === c.code);
                        return { ...c, color: original ? original.color : 'bg-gray-400' };
                    });
                    
                    const flat = [];
                    const dayOrder = { 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5, 'Sat': 6, 'Sun': 7 };
                    coloredCourses.forEach(c => {
                        c.schedules.forEach(s => {
                            flat.push({ ...s, courseCode: c.code, courseName: c.name, teacher: c.teacher, room: s.room || c.room, color: c.color, id: c.id });
                        });
                    });
                    flat.sort((a, b) => {
                        if (a.day !== b.day) return dayOrder[a.day] - dayOrder[b.day];
                        return a.start.localeCompare(b.start);
                    });
                    setOptimalSchedule({ courses: coloredCourses, flatSchedule: flat, totalUnits: data.totalUnits });
                    // 算完把视线带到底部的周课表
                    setTimeout(() => { const el = document.getElementById('weekly-timetable'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
                })
                .catch(err => { setIsCalculating(false); alert("计算请求失败: " + err.message); });
            };

                                                        {item.label}<span className="text-[9px]">▾</span>

                                                                    </button>

                                                    </div>
                                                </div>

                                                        : 'text-[#7a6a5d] border-b border-transparent hover:text-[#1a140d] hover:border-[#1a140d]/40'

                                        退出

                                                        rows.push(
                                                            <button
                                                                key={item.key}

                                                                    active ? 'text-[#1a140d] bg-[#1a140d]/5' : 'text-[#3d3025] hover:bg-[#1a140d]/[0.025]'
                                                                }`}
                                                            >
                                                                <span className="book-serif italic text-[#a08c7d] text-sm w-7 shrink-0">{toRoman(entryNo)}.</span>
                                                                <span>{item.label}</span>
                                                            </button>
                                                        );
                                                    }
                                                });
                                                return rows;
                                            })()}
                                            {!user ? (
                                                <button onClick={() => { setShowAuthModal(true); setIsMenuOpen(false); }} className="book-serif italic w-full text-left px-5 py-3 text-[#3d3025] border-t border-[#1a140d]/20 hover:bg-[#1a140d]/[0.025]">
                                                    登录
                                                </button>
                                            ) : (
                                                <button onClick={logout} className="book-serif italic w-full text-left px-5 py-3 text-[#3d3025] border-t border-[#1a140d]/20 hover:bg-[#1a140d]/[0.025]">
                                                    退出
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <UpdateNotice />

                    {currentView === 'home' ? (
                        <HomeView
                            user={user}
                            availableCourses={availableCourses}
                            teacherCount={teacherCount}
                            selectedCount={selectedCodes.length}
                            onNavigate={goToView}

                        />
                    ) : currentView === 'explorer' ? (
                        <div className="max-w-6xl mx-auto px-4 md:px-8 mt-8">
                             <ExplorerView
                                availableCourses={availableCourses}

                                onViewTeacher={(name) => setViewingTeacher(name)}
                                onViewCourse={(code) => setInsightCourse(code)}
                                cartCodes={selectedCodes.map(c => c.code)}
                                onRemoveCourse={removeCourse}
                             />
                        </div>
                    ) : currentView === 'programme' ? (
                        <div className="max-w-6xl mx-auto px-4 md:px-8 mt-8">
                            <ProgrammeMapView onViewCourse={(code) => setInsightCourse(code)} />
                        </div>
                    ) : currentView === 'career' ? (
                        <div className="max-w-6xl mx-auto px-4 md:px-8 mt-8">
                            <CareerPlannerView
                                onViewCourse={(code) => setInsightCourse(code)}
                                onAddCourse={addCourse}
                                switchToOptimizer={() => goToView('optimizer')}
                                cartCodes={selectedCodes.map(c => c.code)}
                                onRemoveCourse={removeCourse}
                            />

                        <FreeClassroomView

                            onSelectRoom={(room) => setViewingRoom(room)}

                        <DDLView user={user} onLoginRequest={() => setShowAuthModal(true)} />

                        <SettingsView user={user} onLogout={() => { setUser(null); goToView('home'); }} />
                    ) : (
                        <React.Fragment>

                                SCHEDULER<span className="text-[#ec4899]">MAX</span>
                            </h1>
                            <p className="text-xl font-bold text-gray-800 bg-[#d6ff62] inline-block px-4 py-1 border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] rotate-[-2deg]">

                                    <div className="absolute top-0 right-0 bg-black text-white px-3 py-1 font-bold text-sm">STEP 01</div>

                                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-gray-100 border-2 border-black p-2 font-bold focus:outline-none focus:bg-[#3b82f6] focus:text-white transition-colors uppercase" placeholder="e.g. ACCT4043" disabled={loadingCourses} />
                                        {loadingCourses && <div className="text-xs text-gray-500 mt-1">正在读取Excel数据...</div>}
                                        {searchQuery && filteredCourses.length > 0 && (
                                            <div className="absolute top-full left-0 w-full bg-white border-2 border-black border-t-0 shadow-lg max-h-60 overflow-y-auto z-50">
                                                {filteredCourses.map(c => (

                                                        <div className="font-bold text-sm">{c.code}</div>

                                <ProgrammePreselect

                                    cartCodes={selectedCodes.map(c => c.code)}

                                />

                                <div className="bg-[#e5e7eb] border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-6">

                                            selectedCodes.map(course => (
                                                <div key={course.code} className={`relative group border-2 border-black p-3 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-transform hover:-translate-y-1 bg-white`}>
